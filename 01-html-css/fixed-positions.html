<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fixed positions</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        height: 2000px;
      }
      body {
        margin: 0;
      }
      .box {
        padding: 10px;
        border: 5px solid #8e1ea2;
        margin-bottom: 10px;
      }
      .navbar {
        background-color: #2373f4;
        position: fixed;
        top: 0;
        width: 100%;
        /* z-index: -1; */
      }
      .content {
        background-color: #5882e8;
        margin-top: 60px;
      }
      .footer {
        background-color: #e3ef4f;
        position: fixed;
        bottom: 0;
        /* width: 100%; */
        right: 0;
      }
    </style>
  </head>
  <body>
    <div id="container1">
      <div class="box navbar">navbar</div>
      <div class="box content">content</div>
      <div class="box footer">footer</div>
    </div>
  </body>
</html>
