<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css keyframes</title>
    <style>
      body {
        background-color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .box {
        background-color: yellow;
        width: 150px;
        height: 150px;

        position: relative;

        animation: a1 5s forwards ease-in;
      }

      @keyframes a1 {
        25% {
          top: 100px;
          left: 0;
          background-color: blue;
        }
        50% {
          top: 100px;
          left: 100px;
          background-color: aqua;
        }
        75% {
          top: 200px;
          left: 100px;
          background-color: burlywood;
        }
        100% {
          top: 100px;
          left: 200px;
          background-color: chartreuse;
        }
      }

      h1 {
        position: relative;
        animation: text_animation 2s forwards ease-in;
      }

      @keyframes text_animation {
        from {
          top: -1000px;
        }
        to {
          top: 0;
        }
      }
    </style>
  </head>
  <body>
    <h1>Lorem, ipsum dolor.</h1>
    <div class="box"></div>
  </body>
</html>
