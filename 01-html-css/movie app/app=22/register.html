<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How It Works ?</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="forms.css" />
  </head>
  <body id="body">
    <header class="main-header">
      <div class="container">
        <a href="#" class="main-header__logo">X</a>
        <nav class="main-nav">
          <ul class="main-nav__items">
            <li class="main-nav__item">
              <a href="#">Movies</a>
            </li>
            <li class="main-nav__item">
              <a href="#">Shows</a>
            </li>
            <li class="main-nav__item main-nav__login">
              <a class="btn btn-secondary" href="#">Login</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="signup-page">
      <div class="signup-title">Create Your Account</div>
      <form action="" class="signup-form">
        <label for="firstname">First Name</label>
        <input type="text" id="firstname" />

        <label for="lastname">Last Name</label>
        <input type="text" id="lastname" />

        <label for="email">Email</label>
        <input type="email" id="email" />

        <label for="password">Password</label>
        <input type="password" id="password" />

        <label for="gender">Gender</label>
        <select id="gender">
          <option value="">Select</option>
          <option value="">Woman</option>
          <option value="">Man</option>
        </select>

        <input type="checkbox" id="agree-terms" />
        <label for="agree-terms"
          >Agree to
          <a href="#">Terms &amp; Conditions</a>
        </label>

        <button type="submit" class="btn btn-secondary">Sign Up</button>
      </form>
    </main>

    <footer id="footer">
      <div class="container">
        <div class="row">
          <div class="col-2">
            <ul id="footer-links">
              <li><a href="#">About</a></li>
              <li><a href="#">Contact</a></li>
              <li><a href="#">Forum</a></li>
              <li><a href="#">Blog</a></li>
            </ul>
          </div>
          <div class="col-2">
            <ul class="social-links">
              <li>
                <a
                  target="_blank"
                  href="https://x.com"
                  class="fab fa-x-twitter"
                ></a>
              </li>
              <li>
                <a
                  target="_blank"
                  href="https://facebook.com"
                  class="fab fa-facebook"
                ></a>
              </li>
              <li>
                <a
                  target="_blank"
                  href="https://tiktok.com"
                  class="fab fa-tiktok"
                ></a>
              </li>
              <li>
                <a
                  target="_blank"
                  href="https://linkedin.com"
                  class="fab fa-linkedin"
                ></a>
              </li>
              <li>
                <a
                  target="_blank"
                  href="https://instagram.com"
                  class="fab fa-instagram"
                ></a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </footer>

    <a href="#body" id="backtotop">
      <i class="fa-solid fa-circle-chevron-up"></i>
    </a>
  </body>
</html>
