<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>padding</title>
    <style>
      * {
        margin: 0;
      }
      #showcase {
        background-color: rgb(29, 29, 162);
        padding: 60px;
      }
      h1 {
        padding: 20px;
        background-color: aquamarine;
      }
      #how-it-works {
        background-color: rgb(196, 219, 24);
      }
      nav {
        background-color: antiquewhite;
        padding: 20px;
      }
      a {
        padding-left: 10px;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#">home</a>
      <a href="#">contact</a>
      <a href="#">news</a>
    </nav>
    <!-- padding -->
    <main>
      <section id="showcase">
        <h1>welcome to website</h1>
      </section>
      <section id="how-it-works">
        <h2>how it works ?</h2>
      </section>
    </main>
  </body>
</html>
