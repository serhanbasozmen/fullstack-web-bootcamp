<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>background</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
      }
      #header {
        position: relative;
        background-color: aqua;
        background-image: url(images/home-bg2.jpeg);
        background-repeat: no-repeat;
        height: 100vh;
        /* width: 80vw; */
      }
      #header h1 {
        margin: 0;
        position: absolute;
        font-size: 80px;
        color: wheat;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div id="header">
      <h1>background text</h1>
      <!-- <div class="cover"></div> -->
    </div>
  </body>
</html>
