<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tables</title>
  </head>
  <body>
    <table border="1" width="100%" cellpadding="12" cellspacing="10">
      <thead>
        <tr>
          <th>product id</th>
          <th>product name</th>
          <th>price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>product 1</td>
          <td>iphone 8</td>
          <td>400$</td>
        </tr>
        <tr>
          <td rowspan="2">product 2</td>
          <td>iphone 7</td>
          <td>1000$</td>
        </tr>
        <tr>
          <td colspan="1">iphone x</td>
          <td>2000$</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
