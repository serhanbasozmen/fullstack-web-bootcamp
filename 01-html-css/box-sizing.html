<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>box sizing</title>
    <style>
      * {
        box-sizing: border-box;
      }
      #showcase {
        background-color: #1f06ac;
        height: 500px;
        width: 100%;
        padding: 10px;
        border: 5px solid rgb(14, 32, 14);
      }
      #how-it-works {
        background-color: #e3ef4f;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#">home</a>
      <a href="#">contact</a>
      <a href="#">news</a>
    </nav>
    <main>
      <section id="showcase">
        <h1>welcome to website</h1>
      </section>
      <section id="how-it-works">
        <h2>how it works ?</h2>
      </section>
    </main>
  </body>
</html>
