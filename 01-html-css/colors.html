<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>colors</title>
    <style>
      div {
        height: 150px;
        border: 2px solid gray;
        margin-bottom: 10px;
      }
      #box1 {
        background-color: rgba(0, 0, 255, 0.6);
        /* opacity: 0.8; */
      }
      #box1:hover {
        background-color: rgba(0, 0, 255, 1);
        /* opacity: 0.8; */
      }
      #box2 {
        background-color: yellow;
        opacity: 0.4;
        transition: opacity 0.6s;
      }
      #box2:hover {
        background-color: yellow;
        opacity: 1;
      }
      #box3 {
        background-color: green;
        opacity: 0.2;
        transition: opacity 0.6s;
      }
      #box3:hover {
        background-color: green;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="box1"></div>
    <div id="box2"></div>
    <div id="box3"></div>
  </body>
</html>
