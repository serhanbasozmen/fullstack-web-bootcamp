<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>borders</title>
    <style>
      * {
        margin: 0;
      }
      #showcase {
        background-color: #1f06ac;
        padding: 60px;
      }
      h1 {
        padding: 20px;
        background-color: #e3ef4f;
        border-left: 10px solid white;
        /* border-top: 5px solid yellow; */
        /* border-right: 5px solid rgb(221, 0, 255); */
        /* border-width: 5px;
        border-style: solid;
        border-color: yellow; */
      }
      #how-it-works {
        background-color: #e3ef4f;
      }
      nav {
        background-color: #5882e8;
        padding: 20px;
        border-bottom: 10px solid #e3ef4f;
      }
      a {
        padding: 4px;
        border: 1px solid #e3ef4f;
        border-radius: 10px;
        background-color: #e3ef4f;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#">home</a>
      <a href="#">contact</a>
      <a href="#">news</a>
    </nav>
    <!-- borders -->
    <main>
      <section id="showcase">
        <h1>welcome to website</h1>
      </section>
      <section id="how-it-works">
        <h2>how it works ?</h2>
      </section>
    </main>
  </body>
</html>
