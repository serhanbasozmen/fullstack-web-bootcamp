<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>styling login</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      #showcase {
        background-color: #1f06ac;
        height: 500px;
        width: 100%;
        padding: 10px;
      }
      #how-it-works {
        background-color: #e3ef4f;
        padding: 13px;
      }
      .main-header {
        background-color: aquamarine;
        padding: 8px 16px;
      }
      .main-nav {
        display: inline-block;
        width: calc(100% - 20px);
        text-align: right;
      }
      .main-nav__items {
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .main-nav__item {
        display: inline-block;
        margin: 0px 5px;
      }

      .main-header__logo {
        color: rgb(149, 109, 35);
        font-size: 20px;
        font-weight: bold;
        text-decoration: none;
      }
      .main-nav__item a {
        text-decoration: none;
        color: rgb(149, 109, 35);
        font-weight: bold;
      }
      .main-nav__item a:hover {
        color: #1f06ac;
      }
      .main-nav__item a:active {
        color: rgba(218, 24, 176, 0.89);
      }
      .main-nav__item a::before {
        content: "\2B24";
        padding: 4px;
        font-size: 10px;
      }
      .main-nav__login a {
        color: black;
        background-color: #e3ef4f;
        padding: 5px 12px;
        border-radius: 10px;
        border: 2px solid #1f06ac;
      }
      .main-nav__login a::before {
        content: none;
      }
      .main-nav__login a:hover {
        color: white;
        background-color: #1f06ac;
        border: 3px solid #e3ef4f;
      }
    </style>
  </head>
  <body>
    <header class="main-header">
      <a href="#" class="main-header__logo">x</a>
      <nav class="main-nav">
        <ul class="main-nav__items">
          <li class="main-nav__item">
            <a href="#">movies</a>
          </li>
          <li class="main-nav__item">
            <a href="#">shows</a>
          </li>
          <li class="main-nav__item main-nav__login">
            <a href="#">login</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="showcase">
        <h1>welcome to website</h1>
      </section>
      <section id="how-it-works">
        <h2>how it works ?</h2>
      </section>
    </main>
  </body>
</html>
