<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists</title>
  </head>
  <body>
    <ul style="list-style-type: circle">
      <li>item 1</li>
      <li>item 2</li>
      <li>item 3</li>
      <li>
        item 4
        <ul>
          <li>4.1</li>
          <li>4.2</li>
          <li>4.3</li>
        </ul>
      </li>
    </ul>

    <ol type="I" start="10">
      <li>item x</li>
      <li>item y</li>
      <li>item z</li>
    </ol>

    <dl>
      <dt>html</dt>
      <dd>what is html</dd>
      <dd>html heading</dd>
      <dt>css</dt>
      <dd>inline css</dd>
      <dd>external css</dd>
      <dd>internal css</dd>
    </dl>
  </body>
</html>
