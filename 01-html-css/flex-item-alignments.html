<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <style>
      .container {
        display: flex;

        flex-direction: column;
        /* align-items: flex-end; */

        height: 500px;
        background-color: #1f06ac;
      }
      .item {
        background-color: #e3ef4f;
        padding: 30px;
        margin: 20px;
        color: black;
        font-size: 25px;
      }

      .item-1 {
        align-self: flex-start;
      }
      .item-2 {
        align-self: center;
      }
    </style>
    <title>flex item alignments</title>
  </head>
  <body>
    <div class="container">
      <div class="item item-1">item 1</div>
      <div class="item item-2">item 2</div>
      <div class="item item-3">item 3</div>
      <div class="item item-4">item 4</div>
    </div>
  </body>
</html>
