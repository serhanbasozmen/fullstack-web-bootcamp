<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>styling list</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      #showcase {
        background-color: #1f06ac;
        height: 500px;
        width: 100%;
        padding: 10px;
      }
      #how-it-works {
        background-color: #e3ef4f;
        padding: 13px;
      }
      .main-header {
        background-color: aquamarine;
      }
      .main-nav {
        display: inline-block;
        width: calc(100% - 20px);
        text-align: right;
      }
      .main-nav__items {
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .main-nav__item {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <header class="main-header">
      <a href="#">x</a>
      <nav class="main-nav">
        <ul class="main-nav__items">
          <li class="main-nav__item">
            <a href="#">home</a>
          </li>
          <li class="main-nav__item">
            <a href="#">contact</a>
          </li>
          <li class="main-nav__item">
            <a href="#">news</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="showcase">
        <h1>welcome to website</h1>
      </section>
      <section id="how-it-works">
        <h2>how it works ?</h2>
      </section>
    </main>
  </body>
</html>
